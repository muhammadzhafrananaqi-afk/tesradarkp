  var d=Math.ceil((end-NOW)/864e5);
  if(d<=7)return {label:'Tutup '+d+' hari lagi',cls:'p-u',closed:false,days:d};

  var q=S.q.trim().toLowerCase();
  var list=S.items.filter(function(it){
    if(S.kind!=='semua'&&it.type!==S.kind)return false;
    if(S.cat!=='Semua'&&it.field!==S.cat)return false;
    if(q&&(it.title+' '+it.short+' '+it.field+' '+(it.organizer||'')+' '+(it.place||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(cmp);
  var h='<p class="rescount" aria-live="polite">'+list.length+' hasil ditemukan</p>';
  if(!list.length)return h+'<div class="empty"><b>Belum ada yang cocok</b>Coba kata kunci lain atau ganti filter. <button class="link-btn" data-act="reset">Hapus semua filter</button></div>';
  return h+'<div class="grid">'+list.map(card).join('')+'</div>';
}
function footer(){
  return '<footer class="ftr"><div class="wrap ftr-in"><span><b>ALKP RADAR</b> membantu pelajar menemukan lomba tanpa mencari lama-lama di internet.</span><span class="mono">Data diperbarui oleh admin</span></div></footer>';
}

/* overlays */
function detailHtml(it){
  var info=[['Tempat',it.place,'pin'],['Pelaksanaan',it.date,'cal'],['Batas daftar',it.deadline?fmtLong(parseD(it.deadline)):'','clock'],['Biaya daftar',it.fee,'coin'],['Peserta',it.level,'users'],['Penyelenggara',it.organizer,'org'],['Hadiah',it.prize,'trophy'],['Kontak',it.contact,'phone']].filter(function(x){return x[1]});
  var st=status(it);
  var longP=String(it.long||'').split(/\n+/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
  var link=/^https?:\/\//i.test(it.link||'')?'<a class="btn btn-primary" href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">Daftar atau info resmi</a>':'';
  return '<div class="ov" data-ov="1"><div class="dlg" role="dialog" aria-modal="true" aria-label="'+esc(it.title)+'" tabindex="-1"><button class="x" data-act="closeOv" aria-label="Tutup">'+IC.x+'</button>'+
  '<div class="d-poster"><div class="poster-wrap">'+poster(it)+'<div class="badges">'+(it.hot?'<span class="b b-hot">'+IC.flame+'Hot</span>':'')+(it.example?'<span class="b b-ex">Contoh</span>':'')+'</div></div></div>'+
  '<div class="d-body"><div><div class="kicker">'+kindLabel(it)+' / '+esc(it.field)+'</div><h2>'+esc(it.title)+'</h2></div>'+
  '<p class="d-short">'+esc(it.short)+'</p>'+
  '<div class="d-act"><span class="pill '+st.cls+'">'+esc(st.label)+'</span>'+link+'</div>'+
  (longP?'<div class="d-sec d-long"><h3>Tentang lomba</h3>'+longP+'</div>':'')+
  (info.length?'<dl class="info">'+info.map(function(x){return '<div><dt>'+IC[x[2]]+x[0]+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join('')+'</dl>':'')+
  ((it.timeline&&it.timeline.length)?'<div class="d-sec"><h3>Timeline</h3><ol class="tl">'+it.timeline.map(function(t){return '<li><span class="tl-d">'+esc(t.d)+'</span><span>'+esc(t.t)+'</span></li>'}).join('')+'</ol></div>':'')+
  (S.admin?'<div class="d-act"><button class="btn" data-act="edit" data-id="'+esc(it.id)+'">Edit</button><button class="btn btn-danger" data-act="del" data-id="'+esc(it.id)+'">'+(S.confirm==='del:'+it.id?'Yakin hapus?':'Hapus')+'</button></div>':'')+
  '</div></div></div>';
}
function pwHtml(){
  return '<div class="ov" data-ov="1"><div class="dlg sm" role="dialog" aria-modal="true" aria-label="Masuk admin" tabindex="-1"><button class="x" data-act="closeOv" aria-label="Tutup">'+IC.x+'</button>'+
  '<form class="fm" id="pwForm"><h2>Masuk admin</h2><p style="margin:0;color:var(--muted);font-size:14.5px">Masukkan password untuk menambah, mengubah, atau menghapus data lomba.</p>'+
  '<label for="pw">Password<input class="field" id="pw" type="password" autocomplete="current-password" required></label><p class="err" id="pwErr"></p>'+
  '<div class="fm-act"><button type="button" class="btn" data-act="closeOv">Batal</button><button class="btn btn-primary" type="submit">Masuk</button></div></form></div></div>';
}
function fieldOptions(type,val){
  var list=type==='olimpiade'?OLI:LOMBA;
  var custom=val&&list.indexOf(val)<0;
  return list.map(function(f){return '<option'+(f===val?' selected':'')+'>'+esc(f)+'</option>'}).join('')+'<option value="__custom"'+(custom?' selected':'')+'>Lainnya (ketik sendiri)</option>';
}
function tlRow(d,t){
  return '<div class="tl-row"><input class="field" placeholder="Tanggal, mis. 12 Des" value="'+esc(d)+'" aria-label="Tanggal timeline"><input class="field" placeholder="Kegiatan" value="'+esc(t)+'" aria-label="Kegiatan timeline"><button type="button" class="btn btn-sm" data-act="delrow" aria-label="Hapus baris">'+IC.x+'</button></div>';
}
function formHtml(){
  var it=S.form.item,type=it.type||'lomba';
  var list=type==='olimpiade'?OLI:LOMBA;
  var custom=it.field&&list.indexOf(it.field)<0;
  var tl=(it.timeline&&it.timeline.length?it.timeline:[{d:'',t:''}]).map(function(t){return tlRow(t.d,t.t)}).join('');
  return '<div class="ov" data-ov="1"><div class="dlg" role="dialog" aria-modal="true" aria-label="Form lomba" tabindex="-1"><button class="x" data-act="closeOv" aria-label="Tutup">'+IC.x+'</button>'+
  '<form class="fm" id="itemForm" novalidate><h2>'+(S.form.isNew?'Tambah lomba':'Edit lomba')+'</h2>'+
  '<div class="lbl">Jenis<div class="seg"><label><input type="radio" name="type" value="lomba"'+(type==='lomba'?' checked':'')+'>Lomba</label><label><input type="radio" name="type" value="olimpiade"'+(type==='olimpiade'?' checked':'')+'>Olimpiade</label></div></div>'+
  '<div class="row2"><label for="f-field"><span id="f-fieldlbl">'+(type==='olimpiade'?'Mata pelajaran':'Bidang')+'</span><select class="field" id="f-field" name="field" style="width:100%">'+fieldOptions(type,it.field)+'</select></label>'+
  '<label for="f-custom" id="f-customwrap"'+(custom?'':' hidden')+'>Nama bidang<input class="field" id="f-custom" name="fieldCustom" value="'+esc(custom?it.field:'')+'" placeholder="Mis. Panahan"></label></div>'+
  '<label for="f-title">Judul lomba<input class="field" id="f-title" name="title" value="'+esc(it.title)+'" required></label>'+
  '<label for="f-short">Deskripsi singkat <small>Tampil di kartu, maksimal 160 karakter</small><textarea class="field" id="f-short" name="short" maxlength="160" style="min-height:74px">'+esc(it.short)+'</textarea></label>'+
  '<label for="f-long">Deskripsi lengkap <small>Pisahkan paragraf dengan baris baru</small><textarea class="field" id="f-long" name="long">'+esc(it.long)+'</textarea></label>'+
  '<div class="lbl">Foto atau poster<div class="photo-box"><div id="photoPrev">'+(it.photo?poster(it):'<div class="poster gen" style="--h:'+hue(it.field||'x')+'"><span class="gen-k">Otomatis</span><span class="gen-f">Tanpa foto</span></div>')+'</div><div style="display:flex;flex-direction:column;gap:8px"><input type="file" id="f-photo" accept="image/*" aria-label="Pilih foto"><button type="button" class="btn btn-sm" data-act="clearPhoto">Hapus foto</button></div></div></div>'+
  '<div class="row2"><label for="f-place">Tempat<input class="field" id="f-place" name="place" value="'+esc(it.place)+'"></label><label for="f-date">Tanggal pelaksanaan<input class="field" id="f-date" name="date" value="'+esc(it.date)+'" placeholder="Mis. 12 sampai 14 Desember 2026"></label></div>'+
  '<div class="row2"><label for="f-deadline">Batas pendaftaran<input class="field" type="date" id="f-deadline" name="deadline" value="'+esc(it.deadline)+'"></label><label for="f-fee">Biaya pendaftaran<input class="field" id="f-fee" name="fee" value="'+esc(it.fee)+'" placeholder="Mis. Rp 150.000 atau Gratis"></label></div>'+
  '<div class="row2"><label for="f-level">Tingkat peserta<input class="field" id="f-level" name="level" value="'+esc(it.level)+'" placeholder="Mis. SMA/SMK sederajat"></label><label for="f-org">Penyelenggara<input class="field" id="f-org" name="organizer" value="'+esc(it.organizer)+'"></label></div>'+
  '<div class="row2"><label for="f-prize">Hadiah<input class="field" id="f-prize" name="prize" value="'+esc(it.prize)+'"></label><label for="f-contact">Kontak panitia<input class="field" id="f-contact" name="contact" value="'+esc(it.contact)+'"></label></div>'+
  '<label for="f-link">Link pendaftaran atau info resmi<input class="field" id="f-link" name="link" value="'+esc(it.link)+'" placeholder="https://"></label>'+
  '<div class="lbl">Timeline<div id="tlRows">'+tl+'</div><div><button type="button" class="btn btn-sm" data-act="addrow">Tambah baris</button></div></div>'+
  '<label class="chk" for="f-hot"><input type="checkbox" id="f-hot" name="hot"'+(it.hot?' checked':'')+'>Tandai sebagai hot (tampil di beranda)</label>'+
  '<p class="err" id="formErr" role="alert"></p>'+
  '<div class="fm-act"><button type="button" class="btn" data-act="closeOv">Batal</button><button class="btn btn-primary" type="submit" id="saveBtn">Simpan</button></div></form></div></div>';
}

/* rendering */
function renderOverlay(){
  var o=$('#overlay'),h='';
  if(S.pw)h=pwHtml();else if(S.form)h=formHtml();else if(S.open){var it=byId(S.open);if(it)h=detailHtml(it);else S.open=null}
  o.innerHTML=h;
  document.documentElement.classList.toggle('lock',!!h);
  if(h){var d=o.querySelector('.dlg');var a=o.querySelector('#pw');(a||d).focus()}
}
function renderMain(){
  $('#hdr').innerHTML=header();
  $('#view').innerHTML=S.route==='cari'?search():home();
}
function render(){renderMain();renderOverlay()}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},5000)}

/* persistence: the page republishes itself with the data embedded */
function buildDoc(){
  var rs=document.head.querySelector('style:not(#app-css)');
  var reset=rs&&/safe-area-inset/.test(rs.textContent)?rs.textContent:FALLBACK_RESET;
  var css=document.getElementById('app-css').textContent;
  var js=document.getElementById('app-js').textContent;
  var items=S.items.map(function(it){var c={};for(var k in it)c[k]=it[k];return c});
  var data=JSON.stringify({items:items}).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
  '<title>ALKP RADAR</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONT_LINK+'\n<style id="app-css">'+css+'</style>\n<div id="root"></div>\n'+
  '<script type="application/json" id="app-data">'+data+'<\/script>\n<script id="app-js">'+js+'<\/script></body></html>';
}
function errText(e){
  var c=e&&e.code;
  if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'||c==='consent_required'||c==='none')return 'Perubahan belum tersimpan permanen. Hanya pemilik halaman (akun yang bisa mengedit artifact ini) yang dapat menyimpan data.';
  if(c==='too_large')return 'Data terlalu besar untuk disimpan. Gunakan foto yang lebih kecil atau hapus beberapa data lama.';
  if(c==='rate_limited')return 'Terlalu sering menyimpan. Tunggu sebentar lalu coba lagi.';
  return 'Gagal menyimpan. Coba lagi beberapa saat.';
}
async function persist(msg){
  try{
    var art=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
    if(!art){try{localStorage.setItem('alkp_items',JSON.stringify(S.items));toast(msg+' (tersimpan di browser ini)');return true}catch(x){throw {code:'too_large'}}}
    var html=buildDoc();
    if(html.length>15e6)throw {code:'too_large'};
    try{sessionStorage.setItem('alkp_toast',msg)}catch(e){}
    await art.publish(html);
    return true;
  }catch(e){
    try{sessionStorage.removeItem('alkp_toast')}catch(x){}
    if(e&&e.code==='conflict')return false;
    toast(errText(e));
    return false;
  }
}

/* helpers */
async function sha(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('');
}
function readPhoto(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var s=Math.min(1,900/im.width),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.72));
    };im.onerror=rej;im.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function blank(){return {id:'',type:'lomba',field:'Futsal',title:'',short:'',long:'',place:'',date:'',deadline:'',fee:'',level:'',organizer:'',prize:'',contact:'',link:'',timeline:[{d:'',t:''}],hot:false,photo:''}}
function closeOv(){S.open=null;S.form=null;S.pw=false;S.confirm='';renderOverlay()}
function setRoute(){S.route=(location.hash.replace('#','')==='cari')?'cari':'beranda'}

/* events */
document.addEventListener('click',function(e){
  var ov=e.target.closest&&e.target.closest('.ov');
  if(e.target.classList&&e.target.classList.contains('ov')){closeOv();return}
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='open'){S.open=id;S.confirm='';renderOverlay()}
  else if(act==='closeOv')closeOv();
  else if(act==='admin'){S.pw=true;renderOverlay()}
  else if(act==='logout'){S.admin=false;try{sessionStorage.removeItem('alkp_admin')}catch(x){}render();toast('Keluar dari mode admin.')}
  else if(act==='gocat'){S.kind=el.getAttribute('data-kind');S.cat=el.getAttribute('data-cat');if(location.hash==='#cari'){render()}else{location.hash='#cari'}}
  else if(act==='navcari'){S.kind='semua';S.cat='Semua';S.q='';if(location.hash==='#cari')render()}
  else if(act==='cat'){S.kind=el.getAttribute('data-kind');S.cat=el.getAttribute('data-cat');renderMain()}
  else if(act==='reset'){S.kind='semua';S.cat='Semua';S.q='';renderMain()}
  else if(act==='add'){S.form={item:blank(),isNew:true,photo:''};renderOverlay()}
  else if(act==='edit'){var it=byId(id);if(it){var c=JSON.parse(JSON.stringify(it));S.open=null;S.form={item:c,isNew:false,photo:c.photo||''};renderOverlay()}}
  else if(act==='del'){
    if(S.confirm!=='del:'+id){S.confirm='del:'+id;renderMain();if(S.open)renderOverlay();return}
    S.items=S.items.filter(function(i){return i.id!==id});S.confirm='';S.open=null;render();persist('Lomba dihapus.');
  }
  else if(act==='clearEx'){
    if(S.confirm!=='clearEx'){S.confirm='clearEx';renderMain();return}
    S.items=S.items.filter(function(i){return !i.example});S.confirm='';render();persist('Data contoh dihapus.');
  }
  else if(act==='addrow'){var rows=$('#tlRows');rows.insertAdjacentHTML('beforeend',tlRow('',''))}
  else if(act==='delrow'){var r=el.closest('.tl-row');if(r)r.remove()}
  else if(act==='clearPhoto'){if(S.form){S.form.photo='';var fi=$('#f-photo');if(fi)fi.value='';$('#photoPrev').innerHTML='<div class="poster gen" style="--h:'+hue(S.form.item.field||'x')+'"><span class="gen-k">Otomatis</span><span class="gen-f">Tanpa foto</span></div>'}}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;var r=$('#results');if(r)r.innerHTML=resultsHtml()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sort'){S.sort=t.value;renderMain()}
  else if(t.name==='type'&&S.form){
    var type=t.value;$('#f-field').innerHTML=fieldOptions(type,'');
    $('#f-fieldlbl').textContent=type==='olimpiade'?'Mata pelajaran':'Bidang';
    $('#f-customwrap').hidden=true;
  }
  else if(t.id==='f-field'){$('#f-customwrap').hidden=t.value!=='__custom'}
  else if(t.id==='f-photo'&&t.files&&t.files[0]){
    readPhoto(t.files[0]).then(function(u){S.form.photo=u;$('#photoPrev').innerHTML='<div class="poster"><img src="'+u+'" alt=""></div>'}).catch(function(){$('#formErr').textContent='Foto tidak bisa dibaca. Coba file gambar lain.'});
  }
});
document.addEventListener('submit',async function(e){
  var f=e.target;
  if(f.id==='pwForm'){
    e.preventDefault();
    var err=$('#pwErr');
    try{
      var h=await sha(SALT+$('#pw').value);
      if(h===PW_HASH){S.admin=true;S.pw=false;try{sessionStorage.setItem('alkp_admin','1')}catch(x){}render();toast('Mode admin aktif.')}
      else err.textContent='Password salah. Coba lagi.';
    }catch(x){err.textContent='Browser ini tidak mendukung verifikasi password.'}
  }
  else if(f.id==='itemForm'){
    e.preventDefault();
    var fd=new FormData(f),type=fd.get('type');
    var sel=fd.get('field');
    var field=sel==='__custom'?String(fd.get('fieldCustom')||'').trim():sel;
    var title=String(fd.get('title')||'').trim(),short=String(fd.get('short')||'').trim();
    var er=$('#formErr');
    if(!title){er.textContent='Judul lomba wajib diisi.';return}
    if(!field){er.textContent='Pilih atau ketik bidang lomba.';return}
    if(!short){er.textContent='Deskripsi singkat wajib diisi.';return}
    var tl=[];f.querySelectorAll('.tl-row').forEach(function(r){var i=r.querySelectorAll('input');var d=i[0].value.trim(),t=i[1].value.trim();if(d||t)tl.push({d:d,t:t})});
    var link=String(fd.get('link')||'').trim();
    if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
    var old=S.form.item;
    var item={id:old.id||('i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),type:type,field:field,title:title,short:short,
      long:String(fd.get('long')||'').trim(),place:String(fd.get('place')||'').trim(),date:String(fd.get('date')||'').trim(),deadline:String(fd.get('deadline')||''),
      fee:String(fd.get('fee')||'').trim(),level:String(fd.get('level')||'').trim(),organizer:String(fd.get('organizer')||'').trim(),
      prize:String(fd.get('prize')||'').trim(),contact:String(fd.get('contact')||'').trim(),link:link,timeline:tl,hot:fd.get('hot')==='on',
      photo:S.form.photo||'',created:old.created||Date.now()};
    var isNew=S.form.isNew;
    if(isNew)S.items.unshift(item);else S.items=S.items.map(function(i){return i.id===item.id?item:i});
    S.form=null;render();
    persist(isNew?'Lomba ditambahkan.':'Perubahan disimpan.');
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(S.open||S.form||S.pw))closeOv()});
window.addEventListener('hashchange',function(){setRoute();S.confirm='';render();window.scrollTo(0,0)});

/* boot */
document.getElementById('root').innerHTML='<div id="hdr"></div><main id="view"></main>'+footer()+'<div id="overlay"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>';
setRoute();render();
try{var tm=sessionStorage.getItem('alkp_toast');if(tm){sessionStorage.removeItem('alkp_toast');toast(tm)}}catch(e){}
})();
</script>
