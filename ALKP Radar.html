.dt{text-align:center;border:1px solid var(--line);background:var(--surface);padding:6px 0 7px;line-height:1.1}

.seg button:last-child{border:0}

.count{color:var(--muted);font-size:14.5px;margin:0 0 4px}
.empty{padding:48px 0;color:var(--muted);text-align:center}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:130px minmax(0,1fr);padding:9px 0;border-bottom:1px dotted var(--line)}
.tl span:first-child{color:var(--accent);font-weight:600;font-size:14.5px}
.cta{display:inline-block;margin-top:24px;background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:4px;font-weight:600;text-decoration:none}

.tg .i-sun{display:none}

:root[data-theme="dark"] .tg .i-moon{display:none}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:40px;align-items:center}
.radar{width:100%;max-width:340px;height:auto;display:block;justify-self:center;color:var(--ink)}
.r-ring{fill:none;stroke:var(--muted);stroke-opacity:.35;stroke-width:1}
.r-ax{stroke:var(--muted);stroke-opacity:.3;stroke-width:1}
.r-wedge{fill:var(--accent);opacity:.2}
.r-lead{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.sweep{transform-origin:200px 200px;animation:spin 8s linear infinite}
.blip{animation:pulse 2.6s ease-in-out infinite}
.r-txt{font:500 13px var(--sans);fill:var(--ink)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sweep,.blip{animation:none}}

.bar{height:auto;min-height:62px;gap:24px}
.logo{display:inline-flex;align-items:center;gap:9px;margin-right:auto}

 .row{grid-template-columns:56px minmax(0,1fr);gap:14px}

 dl,.tl li{grid-template-columns:1fr}dt{border:0;padding-bottom:0}

}
